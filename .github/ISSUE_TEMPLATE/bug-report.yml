name: Bug report
description: Report a reproducible problem with Arkivra
title: '[Bug]: '
labels:
  - bug
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Arkivra. Search existing issues before reporting a new bug.

        Do not include credentials, access tokens, encryption keys, private documents, extracted text, database contents, or unredacted provider payloads. Report suspected vulnerabilities through the [security policy](https://github.com/Jasnan/Arkivra/security/policy).

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What went wrong, and what did you expect to happen?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Arkivra version
      description: Provide the release, Docker image tag, or commit SHA. Do not write only "latest".
      placeholder: 0.1.0-rc.1
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or upgrade
        - Authentication or account management
        - Vaults, folders, or permissions
        - Uploads or document processing
        - Search or indexing
        - Document chat or other optional AI features
        - Backups or administration
        - Dashboard or browser behavior
        - Documentation or website
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Deployment details
      description: Include the deployment method, host OS and architecture, browser when relevant, and versions of connected services such as PostgreSQL, Docling, Gotenberg, or an AI provider. Remove secrets.
      placeholder: Docker Compose on Debian 13, linux/amd64, Docling Serve v...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only the minimal redacted output needed to understand the problem. This field is optional.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anything else that may help, including whether the problem started after an update.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: I removed secrets and private document content from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
