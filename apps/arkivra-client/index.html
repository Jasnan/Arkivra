<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Arkivra is a self-hosted, AI-ready document management system for secure vault-based organization."
    />
    <title>Arkivra</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        try {
          let cachedPreferences = {};
          const cachedPreferenceValue = window.localStorage?.getItem('arkivra.uiPreferences');

          if (cachedPreferenceValue) {
            try {
              const parsedPreferences = JSON.parse(cachedPreferenceValue);
              cachedPreferences = parsedPreferences && typeof parsedPreferences === 'object'
                ? parsedPreferences
                : {};
            } catch {
              cachedPreferences = {};
            }
          }

          const normalizeFontFamily = (value) => value === 'manrope' ? 'sora' : value;
          const fontFamily = normalizeFontFamily(cachedPreferences.fontFamily);
          const fontSize = cachedPreferences.fontSize;
          const density = cachedPreferences.density;
          const radius = cachedPreferences.radius;
          const themeMode = cachedPreferences.themeMode || window.localStorage?.getItem('arkivra.themeMode') || 'system';
          const accentColor = cachedPreferences.accentColor || 'blue';
          const legacyPreferenceKeys = [
            'arkivra.accentColor',
            'arkivra.density',
            'arkivra.fontFamily',
            'arkivra.fontSize',
            'arkivra.fontSizeScale',
            'arkivra.radius',
          ];
          const fontSizeScales = {
            sm: '0.95',
            md: '1',
            lg: '1.05',
            xl: '1.1',
            '2xl': '1.15',
          };
          const fontFamilies = new Set(['inter', 'sora', 'space-grotesk']);
          const densityScales = {
            compact: {
              controlHeight: '2rem',
              controlPaddingX: '0.625rem',
              menuItemMinHeight: '2rem',
              menuItemPaddingY: '0.375rem',
              sectionPadding: '1rem',
              rowPaddingY: '0.625rem',
              listHeaderPaddingY: '0.5rem',
              listRowHeight: '3.5rem',
              listIconSize: '2rem',
              gridItemHeight: '12rem',
              gridItemPadding: '1rem',
              gridItemGap: '1.25rem',
            },
            comfortable: {
              controlHeight: '2.5rem',
              controlPaddingX: '0.75rem',
              menuItemMinHeight: '2.5rem',
              menuItemPaddingY: '0.5rem',
              sectionPadding: '1.25rem',
              rowPaddingY: '0.875rem',
              listHeaderPaddingY: '0.75rem',
              listRowHeight: '4.5rem',
              listIconSize: '2.5rem',
              gridItemHeight: '14rem',
              gridItemPadding: '1.25rem',
              gridItemGap: '2rem',
            },
            relaxed: {
              controlHeight: '2.75rem',
              controlPaddingX: '0.875rem',
              menuItemMinHeight: '2.75rem',
              menuItemPaddingY: '0.625rem',
              sectionPadding: '1.5rem',
              rowPaddingY: '1rem',
              listHeaderPaddingY: '0.875rem',
              listRowHeight: '5rem',
              listIconSize: '2.75rem',
              gridItemHeight: '15.5rem',
              gridItemPadding: '1.5rem',
              gridItemGap: '2.25rem',
            },
          };
          const radiusScales = {
            none: { sm: '0', md: '0', lg: '0', xl: '0', '2xl': '0' },
            sm: { sm: '0.25rem', md: '0.375rem', lg: '0.5rem', xl: '0.625rem', '2xl': '0.75rem' },
            md: { sm: '0.375rem', md: '0.5rem', lg: '0.875rem', xl: '1rem', '2xl': '1.25rem' },
            lg: { sm: '0.5rem', md: '0.75rem', lg: '1rem', xl: '1.25rem', '2xl': '1.5rem' },
            xl: { sm: '0.75rem', md: '1rem', lg: '1.25rem', xl: '1.5rem', '2xl': '1.875rem' },
          };
          const accentPalettes = {
            teal: { solid: '#94e2d5', subtle: 'rgba(148, 226, 213, 0.15)', fg: '#94e2d5', muted: 'rgba(148, 226, 213, 0.35)', hover: '#94e2d5', focusRing: 'rgba(148, 226, 213, 0.38)' },
            gray: { solid: '#7f849c', subtle: '#313244', fg: '#cdd6f4', muted: '#585b70', hover: '#cdd6f4', focusRing: 'rgba(127, 132, 156, 0.38)' },
            orange: { solid: '#fab387', subtle: 'rgba(250, 179, 135, 0.15)', fg: '#fab387', muted: 'rgba(250, 179, 135, 0.35)', hover: '#fab387', focusRing: 'rgba(250, 179, 135, 0.38)' },
            yellow: { solid: '#f9e2af', subtle: 'rgba(249, 226, 175, 0.15)', fg: '#f9e2af', muted: 'rgba(249, 226, 175, 0.35)', hover: '#f9e2af', focusRing: 'rgba(249, 226, 175, 0.38)' },
            green: { solid: '#a6e3a1', subtle: 'rgba(166, 227, 161, 0.15)', fg: '#a6e3a1', muted: 'rgba(166, 227, 161, 0.35)', hover: '#a6e3a1', focusRing: 'rgba(166, 227, 161, 0.38)' },
            blue: { solid: '#89b4fa', subtle: 'rgba(137, 180, 250, 0.15)', fg: '#89b4fa', muted: 'rgba(137, 180, 250, 0.35)', hover: '#89b4fa', focusRing: 'rgba(137, 180, 250, 0.38)' },
            cyan: { solid: '#89dceb', subtle: 'rgba(137, 220, 235, 0.15)', fg: '#89dceb', muted: 'rgba(137, 220, 235, 0.35)', hover: '#89dceb', focusRing: 'rgba(137, 220, 235, 0.38)' },
            purple: { solid: '#cba6f7', subtle: 'rgba(203, 166, 247, 0.15)', fg: '#cba6f7', muted: 'rgba(203, 166, 247, 0.35)', hover: '#cba6f7', focusRing: 'rgba(203, 166, 247, 0.38)' },
            pink: { solid: '#f5c2e7', subtle: 'rgba(245, 194, 231, 0.15)', fg: '#f5c2e7', muted: 'rgba(245, 194, 231, 0.35)', hover: '#f5c2e7', focusRing: 'rgba(245, 194, 231, 0.38)' },
          };
          const lightAccentPalettes = {
            teal: { solid: '#179299', subtle: 'rgba(23, 146, 153, 0.12)', fg: '#179299', muted: 'rgba(23, 146, 153, 0.32)', hover: '#209fb5', focusRing: 'rgba(23, 146, 153, 0.35)' },
            gray: { solid: '#8c8fa1', subtle: '#ccd0da', fg: '#4c4f69', muted: '#acb0be', hover: '#4c4f69', focusRing: 'rgba(140, 143, 161, 0.35)' },
            orange: { solid: '#fe640b', subtle: 'rgba(254, 100, 11, 0.12)', fg: '#fe640b', muted: 'rgba(254, 100, 11, 0.32)', hover: '#fe640b', focusRing: 'rgba(254, 100, 11, 0.35)' },
            yellow: { solid: '#df8e1d', subtle: 'rgba(223, 142, 29, 0.12)', fg: '#df8e1d', muted: 'rgba(223, 142, 29, 0.32)', hover: '#df8e1d', focusRing: 'rgba(223, 142, 29, 0.35)' },
            green: { solid: '#40a02b', subtle: 'rgba(64, 160, 43, 0.12)', fg: '#40a02b', muted: 'rgba(64, 160, 43, 0.32)', hover: '#40a02b', focusRing: 'rgba(64, 160, 43, 0.35)' },
            blue: { solid: '#1e66f5', subtle: 'rgba(30, 102, 245, 0.12)', fg: '#1e66f5', muted: 'rgba(30, 102, 245, 0.32)', hover: '#209fb5', focusRing: 'rgba(30, 102, 245, 0.35)' },
            cyan: { solid: '#04a5e5', subtle: 'rgba(4, 165, 229, 0.12)', fg: '#209fb5', muted: 'rgba(4, 165, 229, 0.32)', hover: '#04a5e5', focusRing: 'rgba(4, 165, 229, 0.35)' },
            purple: { solid: '#8839ef', subtle: 'rgba(136, 57, 239, 0.12)', fg: '#8839ef', muted: 'rgba(136, 57, 239, 0.32)', hover: '#8839ef', focusRing: 'rgba(136, 57, 239, 0.35)' },
            pink: { solid: '#ea76cb', subtle: 'rgba(234, 118, 203, 0.12)', fg: '#ea76cb', muted: 'rgba(234, 118, 203, 0.32)', hover: '#ea76cb', focusRing: 'rgba(234, 118, 203, 0.35)' },
          };
          const rootStyle = document.documentElement.style;
          const resolvedTheme = themeMode === 'system'
            ? (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : themeMode;

          document.documentElement.dataset.arkivraFont = fontFamilies.has(fontFamily) ? fontFamily : 'inter';
          document.documentElement.classList.toggle('dark', resolvedTheme === 'dark');
          window.localStorage?.setItem('arkivra.themeMode', ['system', 'light', 'dark'].includes(themeMode) ? themeMode : 'system');
          for (const key of legacyPreferenceKeys) {
            window.localStorage?.removeItem(key);
          }

          if (fontSize && fontSizeScales[fontSize]) {
            rootStyle.setProperty('--arkivra-user-font-scale', fontSizeScales[fontSize]);
          }

          if (densityScales[density]) {
            document.documentElement.dataset.density = density;
            for (const [token, value] of Object.entries(densityScales[density])) {
              rootStyle.setProperty(`--arkivra-${token}`, value);
            }
          }

          if (radiusScales[radius]) {
            for (const [token, value] of Object.entries(radiusScales[radius])) {
              rootStyle.setProperty(`--chakra-radii-${token}`, value);
            }
          }

          if (accentPalettes[accentColor]) {
            const palette = resolvedTheme === 'light' ? lightAccentPalettes[accentColor] : accentPalettes[accentColor];
            rootStyle.setProperty('--chakra-colors-teal-solid', palette.solid);
            rootStyle.setProperty('--chakra-colors-teal-subtle', palette.subtle);
            rootStyle.setProperty('--chakra-colors-teal-fg', palette.fg);
            rootStyle.setProperty('--chakra-colors-teal-muted', palette.muted);
            rootStyle.setProperty('--chakra-colors-teal-hover', palette.hover);
            rootStyle.setProperty('--chakra-colors-teal-focus-ring', palette.focusRing);
          }
        }
        catch {
          document.documentElement.dataset.arkivraFont = 'inter';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
