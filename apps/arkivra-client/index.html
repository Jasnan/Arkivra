<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Arkivra Dashboard</title>
    <meta name="title" content="Arkivra Dashboard" />
    <meta name="description" content="Arkivra dashboard for organizing documents in vaults and searching across files." />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arkivra" />
    <meta property="og:title" content="Arkivra Dashboard" />
    <meta property="og:description" content="Arkivra dashboard for organizing documents in vaults and searching across files." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:alt" content="Arkivra dashboard preview" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arkivra Dashboard" />
    <meta name="twitter:description" content="Arkivra dashboard for organizing documents in vaults and searching across files." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Arkivra dashboard preview" />
    <script>
      (function () {
        try {
          var publicPaths = [
            "/login",
            "/register",
            "/verify-email",
            "/request-password-reset"
          ];
          var pathname = window.location.pathname.replace(/\/$/, "") || "/";
          var isPublicPath = publicPaths.some(function (path) {
            return pathname === path || pathname.endsWith(path);
          });

          if (isPublicPath) return;

          var storagePrefix = "arkivra:appearance";
          var userKey = window.localStorage.getItem(storagePrefix + ":bootstrap-user");
          if (!userKey) return;

          var rawPreferences = window.localStorage.getItem(
            storagePrefix + ":" + encodeURIComponent(userKey)
          );
          if (!rawPreferences) return;

          var preferences = JSON.parse(rawPreferences);
          var themeMode = preferences && preferences.themeMode;
          var resolvedTheme = themeMode;

          if (themeMode === "system") {
            resolvedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }

          if (resolvedTheme !== "dark" && resolvedTheme !== "light") return;

          document.documentElement.classList.remove("dark", "light");
          document.documentElement.classList.add(resolvedTheme);

          if (typeof preferences.selectedRadius === "string") {
            document.documentElement.style.setProperty("--radius", preferences.selectedRadius);
          }

          if (preferences.brandColors && typeof preferences.brandColors === "object") {
            Object.keys(preferences.brandColors).forEach(function (cssVar) {
              var value = preferences.brandColors[cssVar];
              if (cssVar.indexOf("--") === 0 && typeof value === "string") {
                document.documentElement.style.setProperty(cssVar, value);
              }
            });
          }
        } catch {
          document.documentElement.classList.remove("dark", "light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
