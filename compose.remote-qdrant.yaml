# Experimental Privatemode + Qdrant contributor stack. Use a separate Compose project.
#
# This file intentionally builds Arkivra from the current checkout and exposes
# PostgreSQL to the host. Public deployments should use compose.production.yaml.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - '${ARKIVRA_POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: arkivra
      POSTGRES_PASSWORD: arkivra
      POSTGRES_DB: ${POSTGRES_DB_NAME:-arkivra}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arkivra -d "$${POSTGRES_DB:-arkivra}"']
      interval: 5s
      timeout: 5s
      retries: 5

  arkivra:
    image: arkivra:local
    build:
      context: .
      dockerfile: ./apps/arkivra-server/Dockerfile
    restart: unless-stopped
    ports:
      - '${ARKIVRA_PORT:-3210}:${ARKIVRA_PORT:-3210}'
    environment:
      NODE_ENV: production
      ARKIVRA_PROCESS_ROLE: all

      ARKIVRA_PORT: ${ARKIVRA_PORT:-3210}
      ARKIVRA_HOSTNAME: '0.0.0.0'
      ARKIVRA_PUBLIC_URL: ${ARKIVRA_PUBLIC_URL:-http://localhost:3210}

      # Docker-internal DB URL. Do not use localhost or 127.0.0.1 here.
      ARKIVRA_DATABASE_URL: postgres://arkivra:arkivra@postgres:5432/${POSTGRES_DB_NAME:-arkivra}

      # Container storage path.
      ARKIVRA_DATA_PATH: /app/data

      # Auth / secrets from shell via arkivra-secrets.
      ARKIVRA_AUTH_SECRET: ${ARKIVRA_AUTH_SECRET:?Run arkivra-secrets first}
      ARKIVRA_ENCRYPTION_KEYS: ${ARKIVRA_ENCRYPTION_KEYS:?Run arkivra-secrets first}

      # Optional OAuth / AI provider secrets from shell via arkivra-secrets.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # Auth / email config from .env.docker.
      ARKIVRA_AUTH_REGISTRATION_ENABLED: ${ARKIVRA_AUTH_REGISTRATION_ENABLED:-true}
      ARKIVRA_AUTH_EMAIL_VERIFICATION_REQUIRED: ${ARKIVRA_AUTH_EMAIL_VERIFICATION_REQUIRED:-false}
      ARKIVRA_SMTP_URL: ${ARKIVRA_SMTP_URL:-}
      ARKIVRA_EMAIL_FROM: ${ARKIVRA_EMAIL_FROM:-noreply@localhost}
      ARKIVRA_EMAIL_FROM_NAME: ${ARKIVRA_EMAIL_FROM_NAME:-Arkivra}

      # Remote model inference through the trusted encryption proxy.
      ARKIVRA_INGESTION_ENGINE: privatemode
      ARKIVRA_PRIVATEMODE_PROXY_URL: http://privatemode-proxy:8080/v1
      ARKIVRA_PRIVATEMODE_ALLOW_PRIVATE_HTTP: 'true'
      PRIVATEMODE_API_KEY: ${PRIVATEMODE_API_KEY:?Set PRIVATEMODE_API_KEY}
      ARKIVRA_PRIVATEMODE_CACHE_SECRET: ${ARKIVRA_PRIVATEMODE_CACHE_SECRET:?Generate with openssl rand -hex 32}
      ARKIVRA_REMOTE_STRUCTURE_MODEL: ${ARKIVRA_REMOTE_STRUCTURE_MODEL:-gpt-oss-120b}
      ARKIVRA_REMOTE_MAX_CHUNK_CHARACTERS: ${ARKIVRA_REMOTE_MAX_CHUNK_CHARACTERS:-3200}
      ARKIVRA_QDRANT_URL: http://qdrant:6333
      ARKIVRA_QDRANT_API_KEY: ${ARKIVRA_QDRANT_API_KEY:?Set a Qdrant API key}
      ARKIVRA_QDRANT_COLLECTION_PREFIX: arkivra_experiment

      ARKIVRA_GOTENBERG_URL: http://gotenberg:3000

      ARKIVRA_RESTORE_BOOTSTRAP_TOKEN: ${ARKIVRA_RESTORE_BOOTSTRAP_TOKEN:-}

    volumes:
      - arkivra-data:/app/data

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    depends_on:
      postgres:
        condition: service_healthy
      privatemode-proxy:
        condition: service_started
      gotenberg:
        condition: service_started
      qdrant:
        condition: service_started

    healthcheck:
      test: ['CMD-SHELL', 'curl -f "http://localhost:$${ARKIVRA_PORT:-3210}/api/health"']
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${ARKIVRA_QDRANT_API_KEY:?Set a Qdrant API key}
      QDRANT__TELEMETRY_DISABLED: 'true'
    ports:
      - '127.0.0.1:${ARKIVRA_QDRANT_PORT:-6333}:6333'
    volumes:
      - qdrant-data:/qdrant/storage

  privatemode-proxy:
    image: ${PRIVATEMODE_PROXY_IMAGE:-ghcr.io/edgelesssys/privatemode/privatemode-proxy@sha256:5e8f549169c4288c24c902eadc4c6ebfaaf05c06e5605449c34469257929b143}
    restart: unless-stopped
    # Arkivra enables caching via isolated request salts; unsalted requests stay isolated.
    command:
      - --api-key=@/run/secrets/privatemode_api_key
      - --api-key-fallback=never
      - --disable-prompt-cache=true
      - --nvidia-ocsp-allow-unknown=false
      - --nvidia-ocsp-revoked-grace-period=0
      - --workspace=/app/privatemode-proxy
    volumes:
      - privatemode-manifests:/app/privatemode-proxy
    cap_drop:
      - ALL
    secrets:
      - privatemode_api_key
    ports:
      - '127.0.0.1:${ARKIVRA_PRIVATEMODE_PROXY_PORT:-8081}:8080'
    security_opt:
      - no-new-privileges:true

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ARKIVRA_GOTENBERG_PORT:-3001}:3000'

volumes:
  privatemode-manifests:
  qdrant-data:
  postgres-data:
  arkivra-data:

secrets:
  privatemode_api_key:
    environment: PRIVATEMODE_API_KEY
