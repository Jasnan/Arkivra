services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkivra
      POSTGRES_PASSWORD: arkivra
      POSTGRES_DB: arkivra
    ports:
      - '${ARKIVRA_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arkivra -d arkivra']
      interval: 5s
      timeout: 5s
      retries: 5

  arkivra-server:
    image: arkivra-server
    build:
      context: .
      dockerfile: ./apps/arkivra-server/Dockerfile
    restart: unless-stopped
    ports:
      - '${ARKIVRA_PORT:-1221}:${ARKIVRA_PORT:-1221}'
    environment:
      NODE_ENV: production
      ARKIVRA_PROCESS_ROLE: all
      ARKIVRA_PORT: ${ARKIVRA_PORT:-1221}
      ARKIVRA_HOSTNAME: '0.0.0.0'
      ARKIVRA_PUBLIC_URL: ${ARKIVRA_PUBLIC_URL:-http://localhost:${ARKIVRA_WEB_PORT:-5173}}
      ARKIVRA_DATABASE_URL: postgres://arkivra:arkivra@postgres:5432/arkivra
      ARKIVRA_DATA_PATH: /app/data
      ARKIVRA_DOCLING_URL: ${ARKIVRA_DOCLING_URL:?Set ARKIVRA_DOCLING_URL to a reachable Docling Serve endpoint}
      ARKIVRA_AUTH_SECRET: ${ARKIVRA_AUTH_SECRET:?Set ARKIVRA_AUTH_SECRET to a strong stable secret}
      ARKIVRA_AUTH_REGISTRATION_ENABLED: ${ARKIVRA_AUTH_REGISTRATION_ENABLED:-true}
      ARKIVRA_AUTH_EMAIL_VERIFICATION_REQUIRED: ${ARKIVRA_AUTH_EMAIL_VERIFICATION_REQUIRED:-false}
      ARKIVRA_RESTORE_BOOTSTRAP_TOKEN: ${ARKIVRA_RESTORE_BOOTSTRAP_TOKEN:-}
      ARKIVRA_ENCRYPTION_KEYS: ${ARKIVRA_ENCRYPTION_KEYS:?Set ARKIVRA_ENCRYPTION_KEYS to a generated key list}
      ARKIVRA_SMTP_URL: ${ARKIVRA_SMTP_URL:-}
      ARKIVRA_EMAIL_FROM: ${ARKIVRA_EMAIL_FROM:-noreply@localhost}
      ARKIVRA_EMAIL_FROM_NAME: ${ARKIVRA_EMAIL_FROM_NAME:-Arkivra}
    volumes:
      - arkivra-data:/app/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f "http://localhost:$${ARKIVRA_PORT:-1221}/api/health"']
      interval: 10s
      timeout: 5s
      retries: 5

  arkivra-client:
    build:
      context: .
      dockerfile: ./apps/arkivra-client/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - '${ARKIVRA_WEB_PORT:-5173}:${ARKIVRA_WEB_PORT:-5173}'
    environment:
      ARKIVRA_WEB_PORT: ${ARKIVRA_WEB_PORT:-5173}
      ARKIVRA_SERVER_BASE_URL: http://arkivra-server:${ARKIVRA_PORT:-1221}
    depends_on:
      arkivra-server:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --spider -q "http://127.0.0.1:$${ARKIVRA_WEB_PORT:-5173}" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  arkivra-data:
