services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkivra
      POSTGRES_PASSWORD: arkivra
      POSTGRES_DB: arkivra
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arkivra -d arkivra']
      interval: 5s
      timeout: 5s
      retries: 5

  unstructured:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    restart: unless-stopped
    ports:
      - '8000:8000'

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '1221:1221'
    environment:
      NODE_ENV: production
      PROCESS_MODE: web
      ARKIVRA_PORT: '1221'
      ARKIVRA_HOSTNAME: '0.0.0.0'
      ARKIVRA_DATABASE_URL: postgres://arkivra:arkivra@postgres:5432/arkivra
      ARKIVRA_BACKUPS_PATH: /app/backups
      ARKIVRA_UNSTRUCTURED_URL: ${ARKIVRA_UNSTRUCTURED_URL:-http://unstructured:8000}
      ARKIVRA_UNSTRUCTURED_API_KEY: ${ARKIVRA_UNSTRUCTURED_API_KEY:-}
      ARKIVRA_UNSTRUCTURED_STRATEGY: ${ARKIVRA_UNSTRUCTURED_STRATEGY:-hi_res}
      ARKIVRA_UNSTRUCTURED_LANGUAGES: ${ARKIVRA_UNSTRUCTURED_LANGUAGES:-deu,eng}
      ARKIVRA_UNSTRUCTURED_INFER_TABLE_STRUCTURE: ${ARKIVRA_UNSTRUCTURED_INFER_TABLE_STRUCTURE:-true}
      ARKIVRA_UNSTRUCTURED_EXTRACT_IMAGE_BLOCK_TYPES: ${ARKIVRA_UNSTRUCTURED_EXTRACT_IMAGE_BLOCK_TYPES-Image}
      ARKIVRA_UNSTRUCTURED_ENGINE_VERSION: ${ARKIVRA_UNSTRUCTURED_ENGINE_VERSION:-api-v1}
      ARKIVRA_UNSTRUCTURED_SPLIT_PDF_PAGE: ${ARKIVRA_UNSTRUCTURED_SPLIT_PDF_PAGE:-true}
      ARKIVRA_UNSTRUCTURED_SPLIT_PDF_ALLOW_FAILED: ${ARKIVRA_UNSTRUCTURED_SPLIT_PDF_ALLOW_FAILED:-false}
      ARKIVRA_UNSTRUCTURED_SPLIT_PDF_CONCURRENCY: ${ARKIVRA_UNSTRUCTURED_SPLIT_PDF_CONCURRENCY:-5}
      ARKIVRA_UNSTRUCTURED_SPLIT_PDF_BATCH_SIZE: ${ARKIVRA_UNSTRUCTURED_SPLIT_PDF_BATCH_SIZE:-20}
      ARKIVRA_AI_NORMALIZATION_MAX_INPUT_CHARS: ${ARKIVRA_AI_NORMALIZATION_MAX_INPUT_CHARS:-1000}
      ARKIVRA_AUTH_SECRET: ${ARKIVRA_AUTH_SECRET:-arkivra-dev-secret-change-in-production}
      ARKIVRA_ENCRYPTION_KEYS: ${ARKIVRA_ENCRYPTION_KEYS:-}
      ARKIVRA_STORAGE_FS_PATH: /app/document-storage
      ARKIVRA_SERVER_BASE_URL: ${ARKIVRA_SERVER_BASE_URL:-http://localhost:1221}
      ARKIVRA_CORS_ORIGINS: ${ARKIVRA_CORS_ORIGINS:-http://localhost:1221}
    volumes:
      - document-storage:/app/document-storage
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:1221/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PROCESS_MODE: worker
      ARKIVRA_DATABASE_URL: postgres://arkivra:arkivra@postgres:5432/arkivra
      ARKIVRA_BACKUPS_PATH: /app/backups
      ARKIVRA_UNSTRUCTURED_URL: ${ARKIVRA_UNSTRUCTURED_URL:-http://unstructured:8000}
      ARKIVRA_UNSTRUCTURED_API_KEY: ${ARKIVRA_UNSTRUCTURED_API_KEY:-}
      ARKIVRA_UNSTRUCTURED_STRATEGY: ${ARKIVRA_UNSTRUCTURED_STRATEGY:-hi_res}
      ARKIVRA_UNSTRUCTURED_LANGUAGES: ${ARKIVRA_UNSTRUCTURED_LANGUAGES:-deu,eng}
      ARKIVRA_UNSTRUCTURED_INFER_TABLE_STRUCTURE: ${ARKIVRA_UNSTRUCTURED_INFER_TABLE_STRUCTURE:-true}
      ARKIVRA_UNSTRUCTURED_EXTRACT_IMAGE_BLOCK_TYPES: ${ARKIVRA_UNSTRUCTURED_EXTRACT_IMAGE_BLOCK_TYPES-Image}
      ARKIVRA_UNSTRUCTURED_ENGINE_VERSION: ${ARKIVRA_UNSTRUCTURED_ENGINE_VERSION:-api-v1}
      ARKIVRA_UNSTRUCTURED_SPLIT_PDF_PAGE: ${ARKIVRA_UNSTRUCTURED_SPLIT_PDF_PAGE:-true}
      ARKIVRA_UNSTRUCTURED_SPLIT_PDF_ALLOW_FAILED: ${ARKIVRA_UNSTRUCTURED_SPLIT_PDF_ALLOW_FAILED:-false}
      ARKIVRA_UNSTRUCTURED_SPLIT_PDF_CONCURRENCY: ${ARKIVRA_UNSTRUCTURED_SPLIT_PDF_CONCURRENCY:-5}
      ARKIVRA_UNSTRUCTURED_SPLIT_PDF_BATCH_SIZE: ${ARKIVRA_UNSTRUCTURED_SPLIT_PDF_BATCH_SIZE:-20}
      ARKIVRA_AI_NORMALIZATION_MAX_INPUT_CHARS: ${ARKIVRA_AI_NORMALIZATION_MAX_INPUT_CHARS:-1000}
      ARKIVRA_AUTH_SECRET: ${ARKIVRA_AUTH_SECRET:-arkivra-dev-secret-change-in-production}
      ARKIVRA_ENCRYPTION_KEYS: ${ARKIVRA_ENCRYPTION_KEYS:-}
      ARKIVRA_STORAGE_FS_PATH: /app/document-storage
    volumes:
      - document-storage:/app/document-storage
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  document-storage:
  backups:
