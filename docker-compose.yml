services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkivra
      POSTGRES_PASSWORD: arkivra
      POSTGRES_DB: arkivra
    ports:
      - '${ARKIVRA_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arkivra -d arkivra']
      interval: 5s
      timeout: 5s
      retries: 5

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.20.0
    restart: unless-stopped
    environment:
      UVICORN_WORKERS: '1'
    ports:
      - '${ARKIVRA_DOCLING_PORT:-5001}:5001'
    volumes:
      - docling-data:/tmp/docling
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5001/health']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: ./apps/arkivra-server/Dockerfile
    restart: unless-stopped
    ports:
      - '${ARKIVRA_PORT:-1221}:${ARKIVRA_PORT:-1221}'
    environment:
      NODE_ENV: production
      PROCESS_MODE: web
      APP_INSTANCE: ${APP_INSTANCE:-}
      ARKIVRA_PORT: ${ARKIVRA_PORT:-1221}
      ARKIVRA_HOSTNAME: '0.0.0.0'
      ARKIVRA_DATABASE_URL: postgres://arkivra:arkivra@postgres:5432/arkivra
      ARKIVRA_BACKUPS_PATH: /app/backups
      ARKIVRA_DOCLING_URL: ${ARKIVRA_DOCLING_URL:-http://docling:5001}
      ARKIVRA_DOCUMENT_PROCESSING_CONCURRENCY: ${ARKIVRA_DOCUMENT_PROCESSING_CONCURRENCY:-1}
      ARKIVRA_OLLAMA_EMBEDDING_BATCH_SIZE: ${ARKIVRA_OLLAMA_EMBEDDING_BATCH_SIZE:-20}
      ARKIVRA_AUTH_SECRET: ${ARKIVRA_AUTH_SECRET:-arkivra-dev-secret-change-in-production}
      ARKIVRA_ENCRYPTION_KEYS: ${ARKIVRA_ENCRYPTION_KEYS:-}
      ARKIVRA_STORAGE_FS_PATH: /app/document-storage
      ARKIVRA_SERVER_BASE_URL: ${ARKIVRA_SERVER_BASE_URL:-http://localhost:${ARKIVRA_PORT:-1221}}
      ARKIVRA_CORS_ORIGINS: ${ARKIVRA_CORS_ORIGINS:-http://localhost:${ARKIVRA_WEB_PORT:-5173}}
    volumes:
      - document-storage:/app/document-storage
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      docling:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f "http://localhost:$${ARKIVRA_PORT:-1221}/api/health"']
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: ./apps/arkivra-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PROCESS_MODE: worker
      APP_INSTANCE: ${APP_INSTANCE:-}
      ARKIVRA_DATABASE_URL: postgres://arkivra:arkivra@postgres:5432/arkivra
      ARKIVRA_BACKUPS_PATH: /app/backups
      ARKIVRA_DOCLING_URL: ${ARKIVRA_DOCLING_URL:-http://docling:5001}
      ARKIVRA_DOCUMENT_PROCESSING_CONCURRENCY: ${ARKIVRA_DOCUMENT_PROCESSING_CONCURRENCY:-1}
      ARKIVRA_OLLAMA_EMBEDDING_BATCH_SIZE: ${ARKIVRA_OLLAMA_EMBEDDING_BATCH_SIZE:-20}
      ARKIVRA_AUTH_SECRET: ${ARKIVRA_AUTH_SECRET:-arkivra-dev-secret-change-in-production}
      ARKIVRA_ENCRYPTION_KEYS: ${ARKIVRA_ENCRYPTION_KEYS:-}
      ARKIVRA_STORAGE_FS_PATH: /app/document-storage
    volumes:
      - document-storage:/app/document-storage
      - backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      docling:
        condition: service_healthy

volumes:
  postgres-data:
  docling-data:
  document-storage:
  backups:
